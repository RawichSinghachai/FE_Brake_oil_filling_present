<script>
(function () {
  var stage = document.getElementById('stage');
  var nav = document.getElementById('switcher');
  var screens = Array.prototype.slice.call(stage.querySelectorAll('.screen'));
  var keys = screens.map(function (s) { return s.getAttribute('data-screen'); });
  var timer;

  function fit() {
    var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    var x = (window.innerWidth - 1920 * k) / 2;
    var y = (window.innerHeight - 1080 * k) / 2;
    stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + k + ')';
  }

  function setScreen(name) {
    if (keys.indexOf(name) < 0) return;
    screens.forEach(function (s) { s.hidden = s.getAttribute('data-screen') !== name; });
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-current', b.getAttribute('data-go') === name ? 'true' : 'false');
    });
    try { history.replaceState(null, '', '#' + name); } catch (e) {}
  }
  window.setScreen = setScreen;

  function reveal() {
    nav.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function () { nav.classList.remove('show'); }, 3000);
  }

  nav.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-go]');
    if (b) setScreen(b.getAttribute('data-go'));
  });
  document.addEventListener('mousemove', reveal);
  document.addEventListener('keydown', function (e) {
    var i = parseInt(e.key, 10);
    if (i >= 1 && i <= keys.length) { setScreen(keys[i - 1]); reveal(); }
  });
  window.addEventListener('resize', fit);

  fit();
  setScreen(keys.indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : 'ok');
})();
</script>
